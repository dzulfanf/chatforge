# Chatforge local development services.
# Values are read from the root .env file (copy .env.example to .env).
name: chatforge

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - chatforge-db:/var/lib/postgresql/data

volumes:
  chatforge-db:
