server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: chatforge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatforge}
    username: ${DB_USERNAME:chatforge}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

chatforge:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION:3600}
    visitor-expiration-seconds: ${JWT_VISITOR_EXPIRATION:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
