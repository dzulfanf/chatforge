server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: chatforge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatforge}
    username: ${DB_USERNAME:chatforge}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
